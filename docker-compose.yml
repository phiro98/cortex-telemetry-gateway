version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/cortex
    depends_on:
      - redis
      - db

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -c "import asyncio; from app.services.consumer import run_worker; from app.api.deps import async_session; asyncio.run(run_worker(async_session))"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/cortex
    depends_on:
      - redis
      - db
      
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
      
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=cortex
    ports:
      - "5432:5432"
